name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any Rust warning rather than letting them accumulate.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Gate: nothing is packaged until the code is clean.
  # ---------------------------------------------------------------------------
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Frontend tests
        run: npm run test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ---------------------------------------------------------------------------
  # Packages. Each platform builds on its own runner: Tauri cannot cross-compile
  # a Linux package from Windows, and a macOS bundle can only be produced and
  # signed on macOS.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installers
        run: npm run app:build

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, `
                        src-tauri/target/release/bundle/msi/*.msi `
            -ErrorAction SilentlyContinue | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -Append -Encoding ascii SHA256SUMS-windows.txt
            }
          Get-Content SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: davinci-markdown-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS-windows.txt
          if-no-files-found: error

  build-linux:
    name: Linux
    needs: checks
    runs-on: ubuntu-latest
    # Build against the oldest glibc the project supports. `ubuntu-latest` is
    # Ubuntu 24.04 (glibc 2.39), and a package built there refuses to start on
    # Ubuntu 22.04 — the baseline the Linux support statement names — with
    # "version `GLIBC_2.39' not found". The AppImage carried the same newer
    # runtime. A pinned container keeps the 22.04 baseline even after GitHub
    # retires the ubuntu-22.04 runner image (April 2027), and it also avoids
    # the unattended-upgrades behaviour that used to hang apt on that runner.
    container:
      image: ubuntu:22.04
    steps:
      # The base image has no git, and `actions/checkout` needs it.
      - name: Bootstrap the checkout tools
        run: |
          apt-get update -o Acquire::Retries=3
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git tar gzip xz-utils zstd

      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            dpkg-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgtk-3-bin \
            libglib2.0-bin \
            libgdk-pixbuf2.0-bin \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build packages
        run: npm run app:build

      # A package that installs but does not register itself as a handler, or
      # that needs a newer glibc than the supported baseline, fails on a clean
      # machine after the release has shipped. Check both here rather than
      # discovering them from a user report.
      - name: Verify the .deb
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          work=$(mktemp -d)
          dpkg-deb -x "$deb" "$work"

          desktop=$(ls "$work"/usr/share/applications/*.desktop)
          echo "--- $desktop"
          cat "$desktop"
          binary="$work/usr/bin/davinci-markdown"

          grep -q '^Exec=.*%F' "$desktop" || { echo '::error::the desktop entry does not pass files to the application'; exit 1; }
          for mime in text/markdown application/json text/csv text/x-log application/xml; do
            grep -q "^MimeType=.*$mime" "$desktop" || { echo "::error::the desktop entry does not claim $mime"; exit 1; }
          done
          test -f "$work/usr/share/mime/packages/io.davinci.markdown.xml" || { echo '::error::the mime registration is missing'; exit 1; }
          test -x "$binary" || { echo '::error::the binary is missing'; exit 1; }

          # Ubuntu 22.04 is the oldest supported distribution and ships glibc
          # 2.35. A symbol above that version means the package was built on a
          # newer image and will not start on a supported machine.
          glibc=$(readelf --version-info "$binary" | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          [ -n "$glibc" ] || { echo '::error::could not read the glibc requirement'; exit 1; }
          echo "oldest supported glibc: 2.35; binary requires: $glibc"
          dpkg --compare-versions "$glibc" le 2.35 || { echo "::error::the binary requires glibc $glibc, newer than the 2.35 baseline"; exit 1; }

          echo "desktop integration and glibc baseline: ok"

      - name: Generate checksums
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec sha256sum {} \; | sed 's|\./||' | sort -k2 > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: davinci-markdown-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS-linux.txt
          if-no-files-found: warn

  build-macos:
    name: macOS
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Both architectures: Apple Silicon is the default target and Intel Macs
      # are still in use, and the bundle is small enough that shipping one
      # universal build is simpler than two downloads.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build for Apple Silicon
        run: npm run app:build -- --target aarch64-apple-darwin

      - name: Build for Intel
        run: npm run app:build -- --target x86_64-apple-darwin

      # Signing and notarisation need a Developer ID certificate and an Apple
      # account, neither of which exist yet. Until then the bundles are built
      # unsigned and users open them with a right click, which the release notes
      # say. Adding the secrets below is the whole change:
      #
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #
      # tauri reads them from the environment; nothing in the configuration
      # needs to change.

      - name: Generate checksums
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle
          find . -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec shasum -a 256 {} \; > ../../../../../SHA256SUMS-macos-arm64.txt || true
          cd "$GITHUB_WORKSPACE"
          cat SHA256SUMS-macos-arm64.txt 2>/dev/null || echo "no arm64 dmg found"

      - uses: actions/upload-artifact@v4
        with:
          name: davinci-markdown-macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            SHA256SUMS-macos-*.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # On a version tag, collect every artifact into one draft release.
  # ---------------------------------------------------------------------------
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release body is the versioned notes file, so the page a user reads
      # and the repository documentation cannot drift apart.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten the artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Merge the checksums
        run: |
          cd release
          cat SHA256SUMS-*.txt 2>/dev/null | sort -k2 > SHA256SUMS.txt || true
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS.txt 2>/dev/null || echo "no checksums"

      - name: Compose the release body
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cat "$notes" > release-body.md
          else
            echo "DaVinci Markdown Editor ${GITHUB_REF_NAME}" > release-body.md
          fi
          cat >> release-body.md <<'EOF'

          ## Downloads

          | Platform | File |
          |---|---|
          | Windows | `…-setup.exe` (recommended), `….msi` |
          | Debian / Ubuntu / Kali | `…_amd64.deb` (Ubuntu 22.04+ / Debian 12+) |
          | Fedora / RHEL | `…-1.x86_64.rpm` |
          | Any Linux | `…_amd64.AppImage` (glibc 2.35+) |
          | macOS (Apple Silicon) | `…_aarch64.dmg` |
          | macOS (Intel) | `…_x64.dmg` |

          Verify your download against `SHA256SUMS.txt` before installing.

          The installers are not code-signed yet, so Windows SmartScreen and
          macOS Gatekeeper will ask for confirmation on first launch.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          body_path: release-body.md

