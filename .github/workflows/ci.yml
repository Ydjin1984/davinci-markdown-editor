name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any Rust warning rather than letting them accumulate.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Gate: nothing is packaged until the code is clean.
  # ---------------------------------------------------------------------------
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Frontend tests
        run: npm run test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ---------------------------------------------------------------------------
  # Packages. Each platform builds on its own runner: Tauri cannot cross-compile
  # a Linux package from Windows, and a macOS bundle can only be produced and
  # signed on macOS.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installers
        run: npm run app:build

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, `
                        src-tauri/target/release/bundle/msi/*.msi `
            -ErrorAction SilentlyContinue | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -Append -Encoding ascii SHA256SUMS-windows.txt
            }
          Get-Content SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: davinci-markdown-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS-windows.txt
          if-no-files-found: error

  build-linux:
    name: Linux
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build packages
        run: npm run app:build

      # A package that installs but does not register itself as a Markdown
      # handler fails the product's main promise, so check it here rather than
      # discovering it on a clean machine.
      - name: Verify the .deb desktop integration
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          work=$(mktemp -d)
          dpkg-deb -x "$deb" "$work"

          desktop=$(ls "$work"/usr/share/applications/*.desktop)
          echo "--- $desktop"
          cat "$desktop"

          grep -q '^Exec=.*%F' "$desktop" || { echo '::error::the desktop entry does not pass files to the application'; exit 1; }
          grep -q '^MimeType=.*text/markdown' "$desktop" || { echo '::error::the desktop entry does not claim text/markdown'; exit 1; }
          test -f "$work/usr/share/mime/packages/io.davinci.markdown.xml" || { echo '::error::the mime registration is missing'; exit 1; }
          test -x "$work/usr/bin/davinci-markdown" || { echo '::error::the binary is missing'; exit 1; }
          echo "desktop integration: ok"

      - name: Generate checksums
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec sha256sum {} \; | sed 's|\./||' | sort -k2 > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: davinci-markdown-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS-linux.txt
          if-no-files-found: warn

  build-macos:
    name: macOS
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Both architectures: Apple Silicon is the default target and Intel Macs
      # are still in use, and the bundle is small enough that shipping one
      # universal build is simpler than two downloads.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build for Apple Silicon
        run: npm run app:build -- --target aarch64-apple-darwin

      - name: Build for Intel
        run: npm run app:build -- --target x86_64-apple-darwin

      # Signing and notarisation need a Developer ID certificate and an Apple
      # account, neither of which exist yet. Until then the bundles are built
      # unsigned and users open them with a right click, which the release notes
      # say. Adding the secrets below is the whole change:
      #
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #
      # tauri reads them from the environment; nothing in the configuration
      # needs to change.

      - name: Generate checksums
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle
          find . -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec shasum -a 256 {} \; > ../../../../../SHA256SUMS-macos-arm64.txt || true
          cd "$GITHUB_WORKSPACE"
          cat SHA256SUMS-macos-arm64.txt 2>/dev/null || echo "no arm64 dmg found"

      - uses: actions/upload-artifact@v4
        with:
          name: davinci-markdown-macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            SHA256SUMS-macos-*.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # On a version tag, collect every artifact into one draft release.
  # ---------------------------------------------------------------------------
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten the artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Merge the checksums
        run: |
          cd release
          cat SHA256SUMS-*.txt 2>/dev/null | sort -k2 > SHA256SUMS.txt || true
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS.txt 2>/dev/null || echo "no checksums"

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          body: |
            DaVinci Markdown Editor ${{ github.ref_name }}

            | Platform | File |
            |---|---|
            | Windows | `…-setup.exe` (recommended), `….msi` |
            | Debian / Ubuntu / Kali | `…_amd64.deb` |
            | Fedora / RHEL | `…-1.x86_64.rpm` |
            | Any Linux | `…_amd64.AppImage` |
            | macOS (Apple Silicon) | `…_aarch64.dmg` |
            | macOS (Intel) | `…_x64.dmg` |

            Verify your download against `SHA256SUMS.txt` before installing.

            The installers are not code-signed yet, so Windows SmartScreen and
            macOS Gatekeeper will ask for confirmation on first launch.
