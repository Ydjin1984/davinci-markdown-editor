[package]
name = "davinci-markdown-editor"
version = "0.2.0"
description = "Natively integrated Markdown editor with GitHub Flavored Markdown, Mermaid diagrams and live preview"
authors = ["DaVinci Cyber Engineering <info@davinci-cyber-engineering.uz>"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
homepage = "https://www.davinci-cyber-engineering.uz/"
default-run = "davinci-markdown-editor"

[lib]
name = "davinci_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
notify = "8"
walkdir = "2"
# Deleting through the OS trash keeps the "no data loss" promise cheap to honour.
trash = "5"
thiserror = "2"
parking_lot = "0.12"
encoding_rs = "0.8"
chardetng = "0.1"
sha2 = "0.10"
log = "0.4"
percent-encoding = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }
# Used to switch off WebView2's own accelerator keys; see the platform module.
webview2-com = "0.39"
# Provides the `Interface` trait that `cast` between WebView2 settings versions
# requires. Must match the version webview2-com was generated against.
windows-core = "0.62"

[features]
# Enables the Tauri devtools in release builds when explicitly requested.
devtools = ["tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Panics stay unwindable so a fault in a worker thread (watcher, asset server)
# cannot take the whole editor down with it.
panic = "unwind"
strip = true

[profile.dev]
incremental = true
